# Настройки видеоконвейера. Всё бесплатно: локально на RTX или через бесплатные API.

language: ru            # язык ролика: ru, uk, en, ...
duration_sec: 45        # примерная длительность ролика
output_dir: out

# ---------- Сценарий (LLM) ----------
# provider:
#   ollama      — локально на видеокарте (https://ollama.com), бесплатно, без ключей
#   groq        — бесплатный облачный API (ключ: https://console.groq.com), env GROQ_API_KEY
#   gemini      — бесплатный тариф Google AI Studio, env GEMINI_API_KEY
#   openrouter  — бесплатные модели с суффиксом :free, env OPENROUTER_API_KEY
#   pollinations— без ключа, но нестабильно
#   openai      — любой OpenAI-совместимый сервер (LM Studio, vLLM...), задайте base_url
script:
  provider: ollama
  model: qwen2.5:7b     # для ollama; для groq например llama-3.3-70b-versatile, для gemini gemini-2.0-flash
  base_url: ""          # пусто = значение по умолчанию для провайдера
  api_key: ""           # пусто = берётся из переменной окружения
  temperature: 0.9
  scenes: 7             # сколько сцен (картинок/клипов)
  style: "динамичный ролик для TikTok/Shorts: цепляющий хук в первой фразе, короткие фразы, факты, призыв подписаться в конце"

# ---------- Озвучка ----------
# engine:
#   edge   — бесплатные нейроголоса Microsoft Edge (нужен интернет, тайминги слов точные)
#   silero — локально на GPU/CPU (pip install torch), без интернета
tts:
  engine: edge
  voice: ru-RU-DmitryNeural   # ru-RU-SvetlanaNeural, uk-UA-OstapNeural, uk-UA-PolinaNeural, en-US-GuyNeural...
  rate: "+8%"                 # скорость для edge
  silero_speaker: aidar       # для silero: aidar, baya, kseniya, xenia, eugene
  silero_language: ru
  silero_model: v4_ru

# ---------- Видеоряд ----------
# source:
#   pollinations — бесплатная генерация картинок по промпту (без ключа)
#   local        — Stable Diffusion на вашей RTX через diffusers (pip install torch diffusers transformers accelerate)
#   pexels       — бесплатные стоковые видео (ключ: https://www.pexels.com/api/), env PEXELS_API_KEY
visuals:
  source: pollinations
  image_style: "cinematic, highly detailed, dramatic lighting, vertical composition"
  local_model: stabilityai/sdxl-turbo   # или black-forest-labs/FLUX.1-schnell (нужно ~16+ ГБ VRAM)
  local_steps: 4
  local_guidance: 0.0
  gen_width: 768
  gen_height: 1344
  fallback: pollinations                # если основной источник не сработал
  pollinations_token: ""                # бесплатный токен (auth.pollinations.ai) убирает водяной знак; или env POLLINATIONS_TOKEN
  pexels_api_key: ""                    # или env PEXELS_API_KEY

# ---------- Монтаж ----------
render:
  width: 1080
  height: 1920
  fps: 30
  encoder: auto          # auto (NVENC на RTX, иначе libx264), h264_nvenc, libx264
  ken_burns: true        # плавный зум/панорама по картинкам
  music_dir: assets/music   # положите сюда mp3 — будет случайный фон
  music_volume: 0.12

subtitles:
  enabled: true
  font: Arial Black       # положите .ttf в assets/fonts, чтобы использовать свой шрифт
  font_size: 92
  words_per_chunk: 3
  uppercase: true
  color: "#FFFFFF"
  highlight_color: "#FFE600"
  outline: 6
  position_y: 0.68        # 0 = верх, 1 = низ

hook:
  enabled: true           # плашка с заголовком сверху, как в примерах
  font_size: 64
  seconds: 0              # 0 = на весь ролик
